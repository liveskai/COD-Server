set scr_game_onlyheadshots              "0"     // 是否只有爆头才造成伤害
set scr_game_deathpointloss             "0"     // 玩家死亡时扣除多少分
set scr_game_suicidepointloss           "0"     // 玩家自杀时扣除多少分
set scr_game_allowperks                 "1"     // 是否允许使用技能（Perk）。0 = 禁用，1 = 启用
set scr_game_allowsupers                "1"     // 是否允许使用专家武器/专家能力（Payload）。0 = 禁用，1 = 启用
set scr_game_superFastChargeRate        "4"     // 专家武器/能力的充能速度倍率（调大 = 充能更快）
set scr_game_superPointsMod             "4"     // 得分事件转化为专家充能量的倍率
set scr_game_forceuav                   "0"     // 是否强制 UAV 常亮。0 = 禁用，1 = 启用
set scr_game_wallrun                    "1"     // 是否允许蹬墙跑。0 = 禁用，1 = 启用
set scr_game_doublejump                 "1"     // 是否允许二段跳（按住跳跃键可飞行）。0 = 禁用，1 = 启用
set scr_game_allowkillstreaks           "1"     // 是否允许连杀奖励。0 = 禁用，1 = 启用
set scr_game_casualScoreStreaks         "0"     // （大概率未使用）
set scr_game_allow3rdspectate           "1"     // 是否允许观战他人时在第一人称与第三人称之间切换
set scr_game_cwltuning                  "0"     // 将部分特性、专家能力与玩法元素调整为 CWL 比赛数值
set scr_game_ffpunishlimit              "2"     // 允许误杀队友多少次后才惩罚
set scr_game_killstreakdelay            "12"    // 首次重生后多少秒内不能使用连杀奖励（仅在回合制模式中真正生效）
set scr_game_tacticalmode               "0"     // 战术规则集。重制移动、生命值与武器平衡

set scr_nukeTimer                       "10"    // 核弹连杀奖励计时
set scr_nukeCancelMode                  "0"     // （未使用）召唤者死亡时取消核弹

set scr_default_maxagents               "10"    // 允许生成的 AI 最大数量

set scr_disableClientSpawnTraces        "0"     // 某些脚本变量

set scr_hardpoint_allowartillery        "1"     // 未使用
set scr_hardpoint_allowuav              "1"     // 未使用
set scr_hardpoint_allowhelicopter       "1"     // 未使用

set scr_explbulletmod                   "1"
set scr_maxPerPlayerExplosives          "2"

set scr_lethaldelay                     "5"

set scr_playlist_type                   "0"
set scr_requiredmapaspectratio          "1"
