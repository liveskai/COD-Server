//==============================================================
//  服务器名称 与 颜色代码说明
//==============================================================
//  代码 | 颜色
//  -----|------------------
//  ^0   | 黑色
//  ^1   | 红色
//  ^2   | 绿色
//  ^3   | 黄色
//  ^4   | 蓝色
//  ^5   | 青色（浅蓝）
//  ^6   | 粉色
//  ^7   | 白色
//  ^8   | 友方队伍颜色
//  ^9   | 敌方队伍颜色
//  ^:   | 彩虹色
//  ^<   | 天蓝色
//  ^=   | 橙色
//  ^>   | 紫色
//  ^?   | 棕色

set sv_hostname                         "^:超好玩 QQ群456665285"           // 服务器列表中显示的服务器名称
set sv_sayName                          "^:超好玩"                          // 控制台发言时显示的名字前缀
set sv_motd                             "^:超好玩 QQ群456665285"            // 玩家加载界面显示的自定义消息


//==============================================================
//  管理员信息（可选）
//==============================================================

set _Admin ""                                   // 你的用户名
set _Email ""                                   // 电子邮箱，可以留空
set _Website ""                                 // 网站地址（IW4MAdmin 会用到）
set _Location "Earth"                           // 所在地


//==============================================================
//  非玩法相关配置
//==============================================================

set sv_maxclients                       "18"    // 服务器最大玩家数
set ui_maxclients                       "18"    // 同上，这两个数值必须保持一致

set rcon_password                       ""      // 远程控制密码，用于远程或游戏内修改设置（留空 = 关闭）
set g_password                          ""      // 服务器密码锁，防止未授权玩家进入。留空则任何人可加入
set g_deadChat                          "0"     // 是否允许死亡玩家与存活玩家聊天（0 = 不允许，1 = 允许）
set g_inactivity                        "420"   // 玩家挂机多少秒后被踢出（范围 0 - 10000）
set sv_kickBanTime                      "3600"  // 临时封禁时长，单位秒（踢出/临时封禁时生效）（范围 0 - 3600）
set sv_timeout                          "500"   // 超时时长。连接服务器时或网络中断后，超过 20 秒即判定超时
set sv_reconnectlimit                   "30"    // 允许重连的次数上限

set logfile                             "1"     // 是否启用游戏日志
set g_logSync                           "1"     // 1 = 每次写入都刷新 games_mp.log；0 = 仅在游戏结束时刷新。建议用 b3 或 IW4MAdmin 时保持开启
set g_log                               "iw7-mod/logs/games_mp.log"     // 游戏日志文件名。如果你改了这里，用 bigbrotherbot 的话要同步改 B3.xml；IW4MAdmin 会自动识别
set g_consoleLog                        "iw7-mod/logs/console.log"      // 控制台日志文件名。不同服务器可能需要改成别的路径


//==============================================================
//  IW7-MOD 配置
//==============================================================

set bots_enabled                        "1"     // 是否启用机器人（1 = 开启，0 = 关闭）
set bot_difficulty                      "0"     // 机器人难度（0 = 全部，1 = 新兵，2 = 普通，3 = 老兵，4 = 精英）
set bot_autoconnectdefault              "1"     // 自动用机器人填满服务器
set bg_bounces                          "1"     // 是否启用弹跳（高速落地保留速度）
set player_sustainAmmo                  "0"     // 开火不消耗弹夹弹药（注意：这是全局生效，一开所有人都无限子弹）
// set jump_slowdownEnable              "1"     // 跳跃后是否降低移动速度
// set jump_spreadAdd                   "64"    // 跳跃带来的额外散布值
// set jump_enableFallDamage            "1"     // 是否启用坠落伤害
set jump_height                         "39"    // 跳跃高度
// set jump_ladderPushVel               "128"   // 爬梯时的推动速度
set bg_playerEjection                   "1"     // 玩家弹射（受击/爆炸击飞）是否开启
// set g_gravity                        "800"   // 重力，单位：英寸/秒²
// set g_speed                          "190"   // 玩家最大移动速度


//==============================================================
//  基础游戏配置
//==============================================================
//              [!!!!!!!!!!!!!!!!!!!!!]
//  游戏模式必须通过 sv_mapRotation 来设置！
//              [!!!!!!!!!!!!!!!!!!!!!]
//
//  代码   | 游戏模式
//  -------|--------------------------
//  war    | 团队死斗 Team Deathmatch
//  front  | 前线 Frontline
//  dom    | 据点争夺 Domination
//  sd     | 搜索与摧毁 Search and Destroy
//  conf   | 击杀确认 Kill Confirmed
//  dm     | 自由混战 Free For All
//  koth   | 据点 Hardpoint
//  tdef   | 守护 Defender
//  ball   | 上行链路 Uplink
//  dd     | 爆破 Demolition
//  ctf    | 夺旗 Capture The Flag
//  sr     | 搜索与救援 Search and Rescue
//  siege  | 增援 Reinforce
//  grind  | 银行 Grind
//  infect | 感染 Infected
//  gun    | 枪战升级 Gun Game
//  grnd   | 空投区 Drop Zone


//==============================================================
//  脚本 DVAR（全部可自定义）
//==============================================================

set scr_game_allowkillcam               "0"     // 是否允许击杀回放（Killcam）
set scr_game_spectatetype               "2"     // 观战模式。0 = 禁用，1 = 仅队伍/玩家视角，2 = 自由视角
